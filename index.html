<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RuneRogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen arena canvas; OSRS-style stone/parchment panels float over it. Single dark look on purpose. */
:root {
  --stone: #3e3529;
  --stone-dark: #2b241b;
  --stone-deep: #1b1610;
  --rim: #5d5040;
  --ink: #000;
  --yellow: #ffff00;
  --orange: #ff981f;
  --parch: #d8c9a3;
  --parch-ink: #2a1d0d;
  --hp: #12b312;
  --hp-lost: #b30000;
  --pray: #3ab5d8;
  --muted: #c8b98f;
  --blue: #6aa0ff;
  --red: #ff4b4b;
  --font-display: "Pixelify Sans", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Trebuchet MS", Verdana, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stone-deep);
  color: var(--yellow);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.txt { text-shadow: 1px 1px 0 var(--ink); }
img.wiki { image-rendering: auto; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
#hud[hidden] { display: none; }
.hud-top { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel {
  background: color-mix(in srgb, var(--stone) 92%, transparent);
  border: 2px solid var(--ink);
  outline: 2px solid var(--rim);
  outline-offset: -5px;
  padding: 8px 10px;
}
.me { display: flex; gap: 8px; align-items: center; min-width: 0; }
.me .portrait { width: 44px; height: 54px; object-fit: contain; }
.bars { display: grid; gap: 4px; width: clamp(110px, 22vw, 220px); }
.bar { position: relative; height: 16px; background: var(--hp-lost); border: 1px solid var(--ink); }
.bar.pray { background: #12303a; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--hp); }
.bar.pray > i { background: var(--pray); }
.bar > b { position: absolute; inset: 0; font-size: 12px; font-weight: 600; text-align: center; line-height: 14px; color: #fff; text-shadow: 1px 1px 0 #000; }
.wave { text-align: center; }
.wave .name { color: var(--orange); font-size: 20px; font-weight: 700; }
.wave .sub { color: var(--yellow); font-size: 14px; }
.purse { display: flex; gap: 6px; align-items: center; font-size: 18px; color: var(--yellow); }
.purse img { width: 30px; height: 26px; object-fit: contain; }
#bossbar { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); width: min(520px, 80vw); text-align: center; }
#bossbar .bname { color: var(--orange); font-size: 16px; margin-bottom: 2px; }
#bossbar .bar { height: 18px; }
.hud-bottom { position: absolute; bottom: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.prayers { display: flex; gap: 6px; pointer-events: auto; }
.pbtn {
  position: relative; width: 52px; height: 52px; padding: 0;
  background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  cursor: pointer; display: grid; place-items: center;
}
.pbtn img { width: 30px; height: 30px; object-fit: contain; }
.pbtn.on { background: #6b5a2a; box-shadow: inset 0 0 0 2px var(--yellow); }
.pbtn small { position: absolute; left: 3px; top: 1px; font-size: 11px; color: var(--muted); font-family: var(--font-display); }
.pbtn em { position: absolute; right: 3px; bottom: 1px; font-style: normal; font-size: 13px; color: var(--yellow); font-family: var(--font-display); text-shadow: 1px 1px 0 #000; }
#chat {
  width: min(460px, 46vw); max-height: 112px; overflow: hidden;
  background: color-mix(in srgb, var(--parch) 82%, transparent);
  border: 2px solid var(--ink); outline: 2px solid var(--rim); outline-offset: -5px;
  color: var(--parch-ink); font: 600 13px/1.35 var(--font-body);
  padding: 6px 10px; display: flex; flex-direction: column; justify-content: flex-end;
}
#chat .b { color: #0000c8; } #chat .r { color: #9b0000; } #chat .g { color: #005f00; }

/* Overlay screens */
#screen {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 16px; overflow-y: auto;
  background: radial-gradient(ellipse at center, #00000066, #000000cc);
}
#screen[hidden] { display: none; }
.sheet {
  width: min(1060px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--stone); border: 3px solid var(--ink); outline: 3px solid var(--rim); outline-offset: -8px;
  padding: 22px clamp(14px, 3vw, 28px);
}
.sheet h1, .sheet h2 { font-family: var(--font-display); color: var(--orange); margin: 0; text-wrap: balance; text-shadow: 2px 2px 0 #000; }
.sheet h1 { font-size: clamp(34px, 6vw, 56px); letter-spacing: 1px; }
.sheet h2 { font-size: 22px; }
.sheet p { color: var(--muted); margin: 6px 0 0; max-width: 70ch; line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.grid { display: grid; gap: 12px; }
.heroes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 16px; }
.card {
  background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  padding: 10px; color: var(--yellow); text-align: left; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.card:hover, .card:focus-visible { outline: 2px solid var(--yellow); }
.card.sel { outline: 2px solid var(--yellow); background: #4a3f2e; }
.card .art { height: 120px; display: grid; place-items: center; }
.card .art img { max-height: 120px; max-width: 100%; object-fit: contain; }
.card .nm { font-family: var(--font-display); font-size: 17px; color: var(--orange); }
.card .ds { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.lane { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--yellow); }
.lane img { width: 18px; height: 18px; object-fit: contain; }
.btn {
  font-family: var(--font-display); font-size: 18px; color: var(--yellow);
  background: linear-gradient(#5a4b37, #3e3529); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  padding: 8px 18px; cursor: pointer; pointer-events: auto;
}
.btn:hover, .btn:focus-visible { color: #fff; outline: 2px solid var(--yellow); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 22px; padding: 10px 26px; }

/* Shop */
.shop { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); margin-top: 14px; align-items: start; }
@media (max-width: 760px) { .shop { grid-template-columns: 1fr; } #chat { display: none; } }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.skill {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center;
  background: var(--stone-dark); border: 1px solid var(--ink); padding: 5px 7px; cursor: pointer; color: var(--yellow); font: inherit; text-align: left;
}
.skill img { width: 24px; height: 24px; object-fit: contain; }
.skill .lv { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.skill .nm { font-size: 12px; color: var(--muted); line-height: 1.2; }
.skill .cost { font-size: 12px; color: var(--yellow); white-space: nowrap; font-variant-numeric: tabular-nums; }
.skill:hover:not(:disabled) { outline: 1px solid var(--yellow); }
.skill:disabled { opacity: .5; cursor: not-allowed; }
.offers { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.offer .art { height: 64px; }
.offer .art img { max-height: 56px; }
.offer .price { font-family: var(--font-display); color: var(--yellow); font-size: 16px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.offer .price img { width: 20px; height: 18px; }
.offer.sold { opacity: .4; pointer-events: none; }
.gear { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.slot { width: 52px; height: 52px; background: var(--stone-dark); border: 1px solid var(--ink); outline: 1px solid var(--rim); display: grid; place-items: center; position: relative; }
.slot img { max-width: 40px; max-height: 40px; object-fit: contain; }
.slot span { position: absolute; bottom: 1px; right: 3px; font-size: 10px; color: var(--muted); }
.stats { font-size: 13px; color: var(--muted); margin-top: 8px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: start; font-variant-numeric: tabular-nums; }
.stats b { color: var(--yellow); font-weight: 600; }
.sec-title { font-family: var(--font-display); color: var(--orange); font-size: 17px; margin: 0 0 8px; }
.fallback { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-display); color: var(--orange); font-size: 20px; }
.end-art { display: flex; justify-content: center; margin: 12px 0; }
.end-art img { max-height: 160px; }
kbd { font-family: var(--font-display); background: var(--stone-dark); border: 1px solid var(--ink); padding: 0 5px; color: var(--yellow); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

// ======================================================================
// Images: loaded straight from the Old School RuneScape Wiki at runtime.
// Every filename was checked against its File: page on the wiki.
// ======================================================================
const WIKI = 'https://oldschool.runescape.wiki/images/';
const WIKI_REDIRECT = 'https://oldschool.runescape.wiki/w/Special:FilePath/';
const enc = (f) => encodeURIComponent(f).replace(/%2F/g, '/');
const imgCache = {};
function wikiImage(file) {
  if (imgCache[file]) return imgCache[file];
  const im = new Image();
  im.decoding = 'async';
  im.onerror = () => { if (!im._retry) { im._retry = true; im.src = WIKI_REDIRECT + enc(file); } else { im._failed = true; } };
  im.src = WIKI + enc(file);
  imgCache[file] = im;
  return im;
}
const ready = (im) => im && im.complete && im.naturalWidth > 0;
// DOM <img data-wiki="..."> helper with the same fallback chain
function wireImg(el, file, label) {
  el.classList.add('wiki');
  el.onerror = () => {
    if (!el._retry) { el._retry = true; el.src = WIKI_REDIRECT + enc(file); return; }
    const span = document.createElement('span');
    span.className = 'fallback'; span.textContent = (label || file).replace(/_/g, ' ').replace(/\.png$/, '').slice(0, 2);
    el.replaceWith(span);
  };
  el.src = WIKI + enc(file);
  el.alt = el.alt || label || '';
  return el;
}
function imgTag(file, label) { const el = document.createElement('img'); return wireImg(el, file, label); }
document.querySelectorAll('img[data-wiki]').forEach((el) => wireImg(el, el.dataset.wiki, el.alt));

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const WORLD_W = 1400, WORLD_H = 820;
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(w / WORLD_W, h / WORLD_H);
  offX = (w - WORLD_W * scale) / 2; offY = (h - WORLD_H * scale) / 2;
}
addEventListener('resize', resize);

const keys = {};
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (mode !== 'play' && mode !== 'paused') return;
  if (k === '1') togglePrayer('melee');
  if (k === '2') togglePrayer('ranged');
  if (k === '3') togglePrayer('magic');
  if (k === 'e') useItem('shark');
  if (k === 'q') useItem('ppot');
  if (k === 'p' || k === 'escape') togglePause();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (mode === 'play') togglePause(); });

// Touch joystick: press anywhere on the arena and drag
const stick = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', (e) => {
  if (mode !== 'play') return;
  stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.dx = 0; stick.dy = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== stick.id) return;
  stick.dx = e.clientX - stick.ox; stick.dy = e.clientY - stick.oy;
});
const endStick = (e) => { if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; } };
cv.addEventListener('pointerup', endStick);
cv.addEventListener('pointercancel', endStick);

document.querySelectorAll('.pbtn').forEach((b) => b.addEventListener('click', () => {

// ======================================================================
// Sound: small WebAudio blips, started after the first interaction
// ======================================================================
let audio = null;
function sfx(freq, dur = 0.08, type = 'square', vol = 0.04) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch (e) { /* optional */ }
}

// ======================================================================
// Run state
// ======================================================================
let mode = 'title'; // title | play | paused | shop | over
let run = null;
let enemies = [], shots = [], eshots = [], coins = [], splats = [], fx = [], telegraphs = [];

function newRun(hero) {
  const skills = {};
  for (const s of SKILLS) skills[s.id] = s.start;
  Object.assign(skills, hero.skills || {});
  run = {
    hero, skills,
    gear: { weapon: hero.weapon, body: null, offhand: null, neck: null, ring: null },
    potions: 0, inv: { shark: 2, ppot: 1 },
    gold: 0, wave: 0, kills: 0, totalGold: 0, rerolls: 0,
    p: { x: WORLD_W / 2, y: WORLD_H / 2, r: 22, hp: 0, pp: 0, atkT: 0, face: 0, hurtT: 0, frozen: 0, poison: 0 },
    prayer: null,
  };
  run.p.hp = stats().maxHp; run.p.pp = stats().maxPp;
  chatClear();
  chat(`Welcome to RuneRogue, ${hero.name}.`);
  chat('Survive 15 waves and defeat TzTok-Jad.', 'b');
  startWave();
}

function stats() {
  const h = run.hero, s = run.skills, m = h.mods || {};
  const gear = Object.values(run.gear).filter(Boolean).map((id) => ITEMS[id]);
  const sum = (k) => gear.reduce((a, it) => a + (it[k] || 0), 0);
  const weapon = ITEMS[run.gear.weapon].w;
  const lane = h.lane;
  let dmgMult = (m.dmg || 1) * (1 + sum('dmg') + run.potions * 0.1);
  let aspd = 1 + sum('aspd');
  let range = (m.range || 1) * (1 + sum('range'));
  let splash = (m.splash || 1);
  if (lane === 'melee') { dmgMult *= 1 + 0.07 * (s.strength - 1); aspd *= 1 + 0.04 * (s.attack - 1); }
  if (lane === 'ranged') { dmgMult *= 1 + 0.07 * (s.ranged - 1); aspd *= 1 + 0.03 * (s.ranged - 1); }
  if (lane === 'magic') { dmgMult *= 1 + 0.07 * (s.magic - 1); splash *= 1 + 0.03 * (s.magic - 1); }
  const defPts = sum('def') * 1.5 + (s.defence - 1) * 2.5;
  return {
    lane, weapon, dmgMult, aspd, range, splash,
    maxHp: 50 + 5 * (s.hitpoints - 10) + sum('hp'),
    maxPp: 20 + 5 * (s.prayer - 1),
    ppDrain: 1.6 / (1 + 0.12 * (s.prayer - 1)),
    reduce: Math.min(0.7, defPts / 100),
    taken: m.taken || 1,
    speed: 230 * (m.speed || 1) * (1 + 0.04 * (s.agility - 1)),
    goldMult: (m.gold || 1) * (1 + 0.08 * (s.thieving - 1)) * (1 + sum('gold')),
    crit: 0.05 + (m.crit || 0) + 0.02 * (s.slayer - 1),
  };
}

// ======================================================================
// Waves
// ======================================================================
let waveT = 0, spawnT = 0, waveDef = null, bossAlive = null, waveEnding = 0;
function startWave() {
  run.wave++;
  waveDef = WAVES[run.wave - 1];
  enemies = []; shots = []; eshots = []; coins = []; fx = []; telegraphs = [];
  bossAlive = null; waveEnding = 0;
  const st = stats();
  run.p.x = WORLD_W / 2; run.p.y = WORLD_H / 2; run.p.frozen = 0; run.p.poison = 0;
  run.p.pp = st.maxPp; run.prayer = null;
  waveT = waveDef.boss ? 0 : 24 + run.wave * 2;
  spawnT = 0.5;
  if (waveDef.boss) {
    const b = spawnMonster(waveDef.boss, WORLD_W / 2, 260);
    bossAlive = b;
    const def = MONSTERS[waveDef.boss];
    chat(`${def.mini ? 'A mini boss appears' : 'A boss appears'}: ${def.name} (level-${def.lvl})!`, 'r');
    if (def.boss === 'jad') chat('Watch Jad\'s wind-up and pray Missiles (2) or Magic (3)!', 'b');
    sfx(90, 0.6, 'sawtooth', 0.07);
  }
  chat(`Wave ${run.wave}: ${waveDef.area}.`, 'g');
  mode = 'play';
  showScreen(null);
  updatePrayerButtons();
}

function waveScale() { return 1 + 0.1 * (run.wave - 1); }

function spawnMonster(id, x, y) {
  const d = MONSTERS[id];
  const sc = d.boss ? 1 + 0.04 * (run.wave - 1) : waveScale();
  const e = {
    id, d, x, y, r: d.size * 0.36, hp: Math.round(d.hp * sc), maxHp: Math.round(d.hp * sc),
    dmg: d.dmg * (d.boss ? 1 : 1 + 0.05 * (run.wave - 1)),
    hitCd: 0, frozen: 0, castT: 1 + Math.random() * 2, kx: 0, ky: 0, flash: 0,
    ai: { t: 2 + Math.random(), phase: 0, burrow: 0, next: null },
  };
  enemies.push(e);
  return e;
}

function edgeSpawn() {
  const p = run.p;
  for (let i = 0; i < 8; i++) {
    const side = Math.floor(Math.random() * 4);
    const x = side === 0 ? 20 : side === 1 ? WORLD_W - 20 : 20 + Math.random() * (WORLD_W - 40);
    const y = side === 2 ? 20 : side === 3 ? WORLD_H - 20 : 20 + Math.random() * (WORLD_H - 40);
    if (Math.hypot(x - p.x, y - p.y) > 300) return { x, y };
  }
  return { x: 20, y: 20 };
}

function spawnTick(dt) {
  if (!waveDef.hordes.length) return;
  spawnT -= dt;
  if (spawnT > 0 || enemies.length > 75) return;
  const w = run.wave;
  spawnT = Math.max(0.35, 1.6 - w * 0.08) * (bossAlive ? 1.8 : 1);
  const group = 1 + Math.floor(Math.random() * Math.min(4, 1 + w / 3));
  const pos = edgeSpawn();
  for (let i = 0; i < group; i++) {
    const id = waveDef.hordes[Math.floor(Math.random() * waveDef.hordes.length)];
    spawnMonster(id, pos.x + (Math.random() - 0.5) * 60, pos.y + (Math.random() - 0.5) * 60);
  }
  if (waveDef.elites.length && Math.random() < Math.min(0.55, 0.12 + w * 0.035)) {
    const id = waveDef.elites[Math.floor(Math.random() * waveDef.elites.length)];
    const p2 = edgeSpawn();
    spawnMonster(id, p2.x, p2.y);
  }
}

function endWave() {
  mode = 'shop';
  // Coins left on the ground are collected automatically
  for (const c of coins) addGold(c.v, false);
  coins = [];
  const bonus = Math.round((20 + run.wave * 8) * stats().goldMult);
  addGold(bonus, false);
  const st = stats();
  run.p.hp = Math.min(st.maxHp, run.p.hp + Math.round(st.maxHp * 0.5));
  chat(`Wave ${run.wave} cleared. Bonus: ${bonus} coins.`, 'g');
  sfx(660, 0.12, 'triangle', 0.06); setTimeout(() => sfx(880, 0.18, 'triangle', 0.06), 120);
  if (run.wave >= WAVES.length) { victory(); return; }
  rollOffers(true);
  renderShop();
}

// ======================================================================
// Combat
// ======================================================================
function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD;
  for (const e of enemies) {
    if (e.ai.burrow > 0) continue;
    const d = Math.hypot(e.x - x, e.y - y) - e.r;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function rollDamage(base, target, st) {
  if (Math.random() < 0.1) return { dmg: 0, crit: false };
  let dmg = base * st.dmgMult * (0.65 + Math.random() * 0.35);
  if (st.weapon.tbow) dmg *= 1 + Math.min(1.2, target.d.lvl / 300);
  const crit = Math.random() < st.crit;
  if (crit) dmg *= 2;
  return { dmg: Math.max(1, Math.round(dmg)), crit };
}

function damageEnemy(e, dmg, crit, opts = {}) {
  e.hp -= dmg;
  e.flash = 0.12;
  e.aggro = true;
  splats.push({ x: e.x + (Math.random() - 0.5) * 16, y: e.y - e.r * 0.4, v: dmg, crit, t: 0.8, kind: dmg === 0 ? 'miss' : 'hit' });
  if (opts.freeze && dmg > 0 && !e.d.boss) e.frozen = Math.max(e.frozen, opts.freeze);
  if (opts.knock && !e.d.boss) {
    const a = Math.atan2(e.y - run.p.y, e.x - run.p.x);
    e.kx += Math.cos(a) * opts.knock * 4; e.ky += Math.sin(a) * opts.knock * 4;
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  run.kills++;
  const st = stats();
  const value = Math.max(1, Math.round(e.d.gold * st.goldMult * (0.8 + Math.random() * 0.4)));
  if (e.d.boss) {
    for (let i = 0; i < 12; i++) coins.push({ x: e.x + (Math.random() - 0.5) * 120, y: e.y + (Math.random() - 0.5) * 120, v: Math.ceil(value / 12), t: 0 });
    chat(`You have defeated ${e.d.name}!`, 'r');
    sfx(220, 0.4, 'triangle', 0.08); setTimeout(() => sfx(440, 0.5, 'triangle', 0.08), 200);
    burst(e.x, e.y, '#ffd060', 50);
    if (e === bossAlive) { bossAlive = null; waveEnding = 1.6; }
  } else {
    coins.push({ x: e.x, y: e.y, v: value, t: 0 });
    burst(e.x, e.y, '#d8c9a3', 6);
  }
  if (e.d.boss === 'bryo') enemies.forEach((m) => { if (m.summoned) killEnemy(m); });
}

function playerAttack(dt) {
  const p = run.p, st = stats(), w = st.weapon;
  p.atkT -= dt;
  if (p.atkT > 0 || p.frozen > 0) return;
  const reach = w.kind === 'swing' ? w.reach : w.range * st.range;
  const target = nearestEnemy(p.x, p.y, reach + (w.kind === 'swing' ? 10 : 0));
  if (!target) return;
  p.atkT = w.cd / st.aspd;
  const ang = Math.atan2(target.y - p.y, target.x - p.x);
  p.face = ang;
  if (w.kind === 'swing') {
    fx.push({ kind: 'slash', x: p.x, y: p.y, a: ang, arc: w.arc, r: w.reach, t: 0.18, max: 0.18 });
    sfx(w.arc > 6 ? 120 : 300, 0.06, 'square', 0.03);
    for (const e of [...enemies]) {
      const d = Math.hypot(e.x - p.x, e.y - p.y) - e.r;
      if (d > w.reach || e.ai.burrow > 0) continue;
      let da = Math.abs(((Math.atan2(e.y - p.y, e.x - p.x) - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (da > w.arc / 2 && d > 4) continue;
      for (let h = 0; h < (w.hits || 1); h++) {
        if (e.dead) break;
        const r = rollDamage(w.dmg, e, st);
        damageEnemy(e, r.dmg, r.crit, { knock: w.knock });
      }
    }
  } else if (w.kind === 'shot') {
    sfx(700, 0.04, 'triangle', 0.025);
    for (let i = 0; i < w.count; i++) {
      const a = ang + (i - (w.count - 1) / 2) * (w.spread || 0);
      shots.push({ kind: 'arrow', x: p.x, y: p.y, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, life: (w.range * st.range) / w.speed + 0.1, pierce: w.pierce, hit: new Set(), dmg: w.dmg, bolt: w.bolt });
    }
  } else {
    sfx(480, 0.09, 'sine', 0.04);
    shots.push({ kind: 'spell', x: p.x, y: p.y, vx: Math.cos(ang) * w.speed, vy: Math.sin(ang) * w.speed, life: (w.range * st.range) / w.speed + 0.15, pierce: 1, hit: new Set(), dmg: w.dmg, splash: w.splash * st.splash, color: w.color, freeze: w.freeze });
  }
}

function updateShots(dt) {
  const st = stats();
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of enemies) {
      if (e.dead || s.hit.has(e) || e.ai.burrow > 0) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 6) {
        s.hit.add(e);
        if (s.kind === 'spell') {
          fx.push({ kind: 'boom', x: s.x, y: s.y, r: s.splash, color: s.color, t: 0.3, max: 0.3 });
          for (const o of [...enemies]) {
            if (o.dead || o.ai.burrow > 0) continue;
            if (Math.hypot(o.x - s.x, o.y - s.y) < s.splash + o.r * 0.5) {
              const r = rollDamage(o === e ? s.dmg : s.dmg * 0.6, o, st);
              damageEnemy(o, r.dmg, r.crit, { freeze: s.freeze });
            }
          }
          s.life = 0;
        } else {
          const r = rollDamage(s.dmg, e, st);
          damageEnemy(e, r.dmg, r.crit);
          s.pierce--;
          if (s.pierce <= 0) s.life = 0;
        }
        if (s.life <= 0) break;
      }
    }
  }
  shots = shots.filter((s) => s.life > 0 && s.x > -50 && s.x < WORLD_W + 50 && s.y > -50 && s.y < WORLD_H + 50);
}

function hurtPlayer(raw, style, opts = {}) {
  const p = run.p, st = stats();
  let dmg = raw * st.taken * (1 - st.reduce);
  if (run.prayer && run.prayer === style) dmg *= opts.jad ? 0 : 0.3;
  dmg = Math.round(dmg * (0.6 + Math.random() * 0.4));
  if (opts.jad && run.prayer === style) dmg = 0;
  p.hp -= dmg;
  p.hurtT = 0.15;
  splats.push({ x: p.x + (Math.random() - 0.5) * 14, y: p.y - 30, v: dmg, t: 0.8, kind: dmg === 0 ? 'miss' : 'hit', onPlayer: true });
  if (dmg > 0) sfx(130, 0.08, 'sawtooth', 0.04);
  if (opts.freeze) p.frozen = Math.max(p.frozen, opts.freeze);
  if (opts.poison) p.poison = Math.max(p.poison, opts.poison);
  if (p.hp <= 0) die();
}

function updateEnemies(dt) {
  const p = run.p;
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.hitCd = Math.max(0, e.hitCd - dt);
    e.x += e.kx * dt; e.y += e.ky * dt; e.kx *= 0.85; e.ky *= 0.85;
    if (e.frozen > 0) { e.frozen -= dt; continue; }
    if (e.d.boss) bossAI(e, dt);
    if (e.ai.burrow > 0) continue;

    // Jad's healers walk to Jad until you hit them
    const tgt = e.healer && !e.aggro && bossAlive ? bossAlive : p;
    const dx = tgt.x - e.x, dy = tgt.y - e.y, dist = Math.hypot(dx, dy) || 1;
    let want = tgt === p ? 1 : dist > e.r + bossAlive.r ? 1 : 0;
    if (e.d.caster) {
      want = dist > e.d.caster.range ? 1 : dist < e.d.caster.range * 0.7 ? -0.6 : 0;
      e.castT -= dt;
      if (e.castT <= 0 && dist < e.d.caster.range + 80) {
        e.castT = e.d.caster.cd;
        const sp = e.d.caster.speed;
        eshots.push({ x: e.x, y: e.y, vx: dx / dist * sp, vy: dy / dist * sp, r: 9, dmg: e.dmg, style: e.d.style, color: e.d.caster.color, life: 3 });
      }
    }
    if (e.d.blink && Math.random() < dt * 0.25 && dist > 200) {
      // Abyssal demons teleport next to you
      burst(e.x, e.y, '#8a2a5a', 10);
      const a = Math.random() * Math.PI * 2;
      e.x = p.x + Math.cos(a) * 90; e.y = p.y + Math.sin(a) * 90;
      burst(e.x, e.y, '#8a2a5a', 10);
    }
    e.x += dx / dist * e.d.spd * want * dt;
    e.y += dy / dist * e.d.spd * want * dt;
    if (tgt === p && dist < e.r + p.r && e.hitCd <= 0) {
      e.hitCd = e.d.boss ? 1.2 : 0.9;
      hurtPlayer(e.dmg, e.d.style);
    }
  }
  // Soft separation so hordes don't stack into one sprite
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = (a.r + b.r) * 0.75;
      if (d > 0 && d < min) {
        const push = (min - d) / 2, nx = dx / d, ny = dy / d;
        const wa = a.d.boss ? 0.1 : 1, wb = b.d.boss ? 0.1 : 1;
        a.x -= nx * push * wa; a.y -= ny * push * wa; b.x += nx * push * wb; b.y += ny * push * wb;
      }
    }
  }
  for (const e of enemies) { e.x = clamp(e.x, 10, WORLD_W - 10); e.y = clamp(e.y, 10, WORLD_H - 10); }
  enemies = enemies.filter((e) => !e.dead);
}

function bossAI(e, dt) {
  const p = run.p, k = e.d.boss;
  e.ai.t -= dt;
  if (k === 'obor') {
    // Club slam: telegraphed shockwave
    if (e.ai.t <= 0) {
      e.ai.t = 4.2;
      telegraphs.push({ x: e.x, y: e.y, r: 190, t: 1.1, max: 1.1, color: '#ff8a3a', dmg: e.dmg * 1.6, style: 'melee', label: 'Slam!' });
      chat('Obor raises his club!', 'r');
    }
  } else if (k === 'bryo') {
    if (e.ai.t <= 0) {
      e.ai.t = 6.5;
      chat('Bryophyta summons growthlings!', 'r');
      for (let i = 0; i < 3; i++) {
        const m = spawnMonster('moss_giant', e.x + Math.cos(i * 2.1) * 120, e.y + Math.sin(i * 2.1) * 120);
        m.summoned = true; m.hp = m.maxHp = Math.round(m.maxHp * 0.6);
      }
    }
    e.castT -= dt;
    if (e.castT <= 0) {
      e.castT = 2.4;
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, r: 12, dmg: e.dmg * 0.8, style: 'magic', color: '#4fe06a', life: 4 });
    }
  } else if (k === 'mole') {
    if (e.ai.burrow > 0) {
      e.ai.burrow -= dt;
      if (e.ai.burrow <= 0) {
        e.x = e.ai.next.x; e.y = e.ai.next.y;
        burst(e.x, e.y, '#8a6a3c', 30);
        sfx(80, 0.3, 'sawtooth', 0.06);
      }
    } else if (e.ai.t <= 0) {
      e.ai.t = 7;
      e.ai.burrow = 1.6;
      e.ai.next = { x: clamp(p.x + (Math.random() - 0.5) * 300, 80, WORLD_W - 80), y: clamp(p.y + (Math.random() - 0.5) * 300, 80, WORLD_H - 80) };
      telegraphs.push({ x: e.ai.next.x, y: e.ai.next.y, r: 110, t: 1.6, max: 1.6, color: '#c8a060', dmg: e.dmg * 1.3, style: 'melee', label: 'Dig!' });
      burst(e.x, e.y, '#8a6a3c', 30);
      chat('The Giant Mole burrows underground.', 'r');
    }
  } else if (k === 'elvarg' || k === 'kbd') {
    if (e.ai.t <= 0) {
      e.ai.t = k === 'kbd' ? 2.6 : 3.2;
      const breaths = k === 'kbd' ? ['fire', 'poison', 'ice'] : ['fire'];
      const kind = breaths[e.ai.phase++ % breaths.length];
      const color = { fire: '#ff6a1a', poison: '#5fd34a', ice: '#9fe8ff' }[kind];
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const n = k === 'kbd' ? 9 : 7;
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - (n - 1) / 2) * 0.13;
        eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, r: 13, dmg: e.dmg * 0.75, style: 'magic', color, life: 4,
          freeze: kind === 'ice' ? 1.1 : 0, poison: kind === 'poison' ? 5 : 0 });
      }
      sfx(70, 0.4, 'sawtooth', 0.06);
      if (e.ai.phase === 1) chat(`${e.d.name} breathes ${kind === 'fire' ? 'dragonfire' : kind + ' breath'}! Protect from Magic helps.`, 'r');
    }
  } else if (k === 'jad') {
    // Jad: telegraphed magic or ranged attack. Pray the matching protection to take 0.
    if (!e.ai.windup && e.ai.t <= 0) {
      e.ai.windup = { style: Math.random() < 0.5 ? 'magic' : 'ranged', t: Math.max(0.9, 1.5 - (1 - e.hp / e.maxHp) * 0.5) };
      sfx(e.ai.windup.style === 'magic' ? 200 : 600, 0.2, 'triangle', 0.06);
    }
    if (e.ai.windup) {
      e.ai.windup.t -= dt;
      if (e.ai.windup.t <= 0) {
        const style = e.ai.windup.style;
        e.ai.windup = null;
        e.ai.t = 1.6;
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        eshots.push({ x: e.x, y: e.y - 40, vx: Math.cos(a) * 700, vy: Math.sin(a) * 700, r: 16, dmg: 38, style, color: style === 'magic' ? '#ff5a1a' : '#e8c060', life: 3, jad: true, homing: true });
      }
    }
    // Healers at half health, like the real fight
    if (!e.ai.healers && e.hp < e.maxHp / 2) {
      e.ai.healers = true;
      chat('Yt-HurKot healers appear! Hit them to pull them off Jad.', 'r');
      for (let i = 0; i < 4; i++) {
        const sp = edgeSpawn();
        const m = spawnMonster('yt_hurkot', sp.x, sp.y);
        m.healer = true;
      }
    }
  }
  for (const m of enemies) if (m.healer && !m.dead && Math.hypot(m.x - e.x, m.y - e.y) < e.r + 40) e.hp = Math.min(e.maxHp, e.hp + 14 * dt);
}

function updateEnemyShots(dt) {
  const p = run.p;
  for (const s of eshots) {
    if (s.homing) {
      const a = Math.atan2(p.y - s.y, p.x - s.x), sp = Math.hypot(s.vx, s.vy);
      s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
    }
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (Math.hypot(p.x - s.x, p.y - s.y) < p.r + s.r) {
      s.life = 0;
      hurtPlayer(s.dmg, s.style, { freeze: s.freeze, poison: s.poison, jad: s.jad });
    }
  }
  eshots = eshots.filter((s) => s.life > 0 && s.x > -40 && s.x < WORLD_W + 40 && s.y > -40 && s.y < WORLD_H + 40);
  for (const t of telegraphs) {
    t.t -= dt;
    if (t.t <= 0 && !t.done) {
      t.done = true;
      fx.push({ kind: 'boom', x: t.x, y: t.y, r: t.r, color: t.color, t: 0.35, max: 0.35 });
      sfx(60, 0.3, 'sawtooth', 0.07);
      if (Math.hypot(p.x - t.x, p.y - t.y) < t.r) hurtPlayer(t.dmg, t.style);
    }
  }
  telegraphs = telegraphs.filter((t) => !t.done);
}

// ======================================================================
// Player
// ======================================================================
function updatePlayer(dt) {
  const p = run.p, st = stats();
  p.hurtT = Math.max(0, p.hurtT - dt);
  if (p.poison > 0) {
    p.poison -= dt;
    p.poisonTick = (p.poisonTick || 0) - dt;
    if (p.poisonTick <= 0) {
      p.poisonTick = 1;
      p.hp -= 2;
      splats.push({ x: p.x, y: p.y - 30, v: 2, t: 0.8, kind: 'poison', onPlayer: true });
      if (p.hp <= 0) return die();
    }
  }
  if (p.frozen > 0) { p.frozen -= dt; }
  else {
    let mx = 0, my = 0;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (stick.id !== null) {
      const l = Math.hypot(stick.dx, stick.dy);
      if (l > 8) { mx += stick.dx / Math.max(l, 50); my += stick.dy / Math.max(l, 50); }
    }
    const l = Math.hypot(mx, my);
    if (l > 1) { mx /= l; my /= l; }
    p.x = clamp(p.x + mx * st.speed * dt, p.r, WORLD_W - p.r);
    p.y = clamp(p.y + my * st.speed * dt, p.r, WORLD_H - p.r);
    p.moving = l > 0.1;
  }
  // Prayer drain
  if (run.prayer) {
    p.pp -= st.ppDrain * dt;
    if (p.pp <= 0) { p.pp = 0; run.prayer = null; chat('You have run out of prayer points.', 'r'); updatePrayerButtons(); }
  }
  // Coins: magnet and pickup
  for (const c of coins) {
    c.t += dt;
    const d = Math.hypot(p.x - c.x, p.y - c.y);
    if (d < 110) { c.x += (p.x - c.x) / d * 420 * dt; c.y += (p.y - c.y) / d * 420 * dt; }
    if (d < p.r + 8) { addGold(c.v, true); c.got = true; }
  }
  coins = coins.filter((c) => !c.got);
}

function addGold(v, sound) {
  run.gold += v; run.totalGold += v;
  if (sound) sfx(1200 + Math.random() * 200, 0.03, 'square', 0.015);
}

function togglePrayer(style) {
  if (!run || mode !== 'play') return;
  if (run.prayer === style) run.prayer = null;
  else if (run.p.pp > 0) run.prayer = style;
  else chat('You need to recharge your prayer.', 'r');
  sfx(run.prayer ? 520 : 300, 0.06, 'sine', 0.05);
  updatePrayerButtons();
}
function updatePrayerButtons() {
  document.querySelectorAll('.pbtn[data-pray]').forEach((b) => b.classList.toggle('on', run && run.prayer === b.dataset.pray));
}
function useItem(kind) {
  if (!run || mode !== 'play' || run.inv[kind] <= 0) return;
  const st = stats();
  run.inv[kind]--;
  if (kind === 'shark') { run.p.hp = Math.min(st.maxHp, run.p.hp + 20); chat('You eat the shark. It heals some health.'); }
  else { run.p.pp = Math.min(st.maxPp, run.p.pp + 20); chat('You drink some of your prayer potion.'); }
  sfx(400, 0.1, 'sine', 0.05);
}

function die() {
  if (mode !== 'play') return;
  mode = 'over';
  chat('Oh dear, you are dead!', 'r');
  sfx(110, 0.6, 'sawtooth', 0.08);
  saveBest();
  setTimeout(renderGameOver, 700);
}
function victory() {
  mode = 'over';
  saveBest(true);
  renderVictory();
}
function saveBest(won) {
  try {
    const best = JSON.parse(localStorage.getItem('runerogue.best') || '{}');
    const prev = best[run.hero.id] || 0;
    best[run.hero.id] = Math.max(prev, won ? 16 : run.wave);
    localStorage.setItem('runerogue.best', JSON.stringify(best));
  } catch (e) { /* storage optional */ }
}
function loadBest() { try { return JSON.parse(localStorage.getItem('runerogue.best') || '{}'); } catch (e) { return {}; } }

function togglePause() {
  if (mode === 'play') { mode = 'paused'; renderPause(); }
  else if (mode === 'paused') { mode = 'play'; showScreen(null); }
}

// ======================================================================
// Effects
// ======================================================================
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 200;
    fx.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, t: 0.3 + Math.random() * 0.35, max: 0.6 });
  }
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ======================================================================
// Main loop
// ======================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  if (mode === 'play') step(dt);
  for (const f of fx) { f.t -= dt; if (f.kind === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; } }
  fx = fx.filter((f) => f.t > 0);
  for (const s of splats) s.t -= dt;
  splats = splats.filter((s) => s.t > 0);
  draw();
  if (run && (mode === 'play' || mode === 'paused')) drawHud();
  requestAnimationFrame(frame);
}

function step(dt) {
  updatePlayer(dt);
  if (mode !== 'play') return;
  playerAttack(dt);
  updateShots(dt);
  updateEnemies(dt);
  updateEnemyShots(dt);
  if (mode !== 'play') return;
  if (waveDef.boss) {
    spawnTick(dt);
    if (waveEnding > 0) { waveEnding -= dt; if (waveEnding <= 0) endWave(); }
  } else {
    waveT -= dt;
    if (waveT > 2.5) spawnTick(dt);
    if (waveT <= 0) endWave();
  }
}

// ======================================================================
// Drawing
// ======================================================================
function drawGround() {
  const look = (waveDef && AREA_LOOK[waveDef.area]) || AREA_LOOK['Lumbridge'];
  ctx.fillStyle = look[1]; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  // tile pattern, like the game's ground tiles
  const T = 64;
  for (let y = 0; y < WORLD_H; y += T) for (let x = 0; x < WORLD_W; x += T) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; const r = n - Math.floor(n);
    ctx.fillStyle = r < 0.33 ? look[0] : r < 0.66 ? look[1] : look[2];
    ctx.globalAlpha = 0.55; ctx.fillRect(x, y, T, T); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
  for (let x = 0; x <= WORLD_W; x += T) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke(); }
  for (let y = 0; y <= WORLD_H; y += T) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke(); }
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, WORLD_W - 6, WORLD_H - 6);
}

function drawSprite(im, x, y, h, opts = {}) {
  // Draw an image scaled to height h, feet at (x, y)
  if (ready(im)) {
    let w = im.naturalWidth * (h / im.naturalHeight);
    let hh = h;
    const maxW = h * 1.4;
    if (w > maxW) { hh = h * maxW / w; w = maxW; }
    ctx.drawImage(im, x - w / 2, y - hh, w, hh);
    return true;
  }
  ctx.fillStyle = opts.color || '#7a6a50';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y - h / 2, h * 0.32, h / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (opts.label) { text(opts.label, x, y - h / 2, Math.max(10, h * 0.28), '#fff'); }
  return false;
}

function text(s, x, y, size, color = '#ff0', align = 'center', font = 'Pixelify Sans') {
  ctx.font = `600 ${size}px "${font}", "Trebuchet MS", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1.5, y + 1.5);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function draw() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1610'; ctx.fillRect(0, 0, w, h);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  if (!run) { drawTitleBackdrop(); return; }
  drawGround();

  for (const t of telegraphs) {
    const k = 1 - t.t / t.max;
    ctx.fillStyle = t.color + '33'; ctx.strokeStyle = t.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = t.color + '66';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * k, 0, Math.PI * 2); ctx.fill();
    text(t.label, t.x, t.y, 22, '#fff');
  }

  for (const c of coins) {
    const im = wikiImage('Coins_10000.png');
    const bob = Math.sin(c.t * 6) * 2;
    if (ready(im)) ctx.drawImage(im, c.x - 11, c.y - 10 + bob, 22, 19);
    else { ctx.fillStyle = '#ffd34a'; ctx.beginPath(); ctx.arc(c.x, c.y + bob, 6, 0, 7); ctx.fill(); }
  }

  // Sort sprites by feet position for depth
  const sprites = enemies.filter((e) => e.ai.burrow <= 0).map((e) => ({ y: e.y, e }));
  sprites.push({ y: run.p.y, player: true });
  sprites.sort((a, b) => a.y - b.y);
  for (const s of sprites) s.player ? drawPlayer() : drawEnemy(s.e);

  for (const s of shots) {
    if (s.kind === 'arrow') {
      const a = Math.atan2(s.vy, s.vx);
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a);
      ctx.strokeStyle = s.bolt ? '#9ad' : '#c8a060'; ctx.lineWidth = s.bolt ? 4 : 3;
      ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(8, 0); ctx.stroke();
      ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  for (const s of eshots) {
    ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  for (const f of fx) {
    const a = f.t / f.max;
    if (f.kind === 'slash') {
      ctx.strokeStyle = `rgba(255,255,230,${a * 0.9})`; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - a * 0.3), f.a - f.arc / 2, f.a + f.arc / 2); ctx.stroke();
    } else if (f.kind === 'boom') {
      ctx.fillStyle = f.color; ctx.globalAlpha = a * 0.45;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.1 - a * 0.4), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    } else if (f.kind === 'spark') {
      ctx.fillStyle = f.color; ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillRect(f.x - 2, f.y - 2, 4, 4); ctx.globalAlpha = 1;
    }
  }

  for (const s of splats) drawSplat(s);

  if (mode === 'play' && waveDef && !waveDef.boss && waveT < 3 && waveT > 0) text('Wave ending...', WORLD_W / 2, 140, 26, '#ff981f');
  if (stick.id !== null) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = cv.getBoundingClientRect();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(stick.ox - r.left, stick.oy - r.top, 50, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    const l = Math.min(50, Math.hypot(stick.dx, stick.dy)), a = Math.atan2(stick.dy, stick.dx);
    ctx.beginPath(); ctx.arc(stick.ox - r.left + Math.cos(a) * l, stick.oy - r.top + Math.sin(a) * l, 20, 0, 7); ctx.fill();
  }
}

function drawShadow(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPlayer() {
  const p = run.p, h = 84;
  drawShadow(p.x, p.y + 4, 22);
  if (run.prayer) {
    const icon = wikiImage({ melee: 'Protect_from_Melee.png', ranged: 'Protect_from_Missiles.png', magic: 'Protect_from_Magic.png' }[run.prayer]);
    if (ready(icon)) ctx.drawImage(icon, p.x - 13, p.y - h - 34, 26, 26);
  }
  const bob = p.moving ? Math.abs(Math.sin(performance.now() / 90)) * 3 : 0;
  ctx.save();
  if (p.hurtT > 0) ctx.globalAlpha = 0.6;
  drawSprite(wikiImage(run.hero.file), p.x, p.y + 4 - bob, h, { color: '#3a7bd5', label: run.hero.name[0] });
  ctx.restore();
  if (p.frozen > 0) { ctx.fillStyle = 'rgba(160,220,255,0.45)'; ctx.fillRect(p.x - 24, p.y - h, 48, h + 4); }
  if (p.poison > 0) text('Poisoned', p.x, p.y + 18, 13, '#5fd34a');
  // weapon icon floating at the attack side
  const wi = wikiImage(ITEMS[run.gear.weapon].file);
  if (ready(wi)) {
    const a = p.face;
    ctx.save(); ctx.translate(p.x + Math.cos(a) * 28, p.y - 36 + Math.sin(a) * 16);
    ctx.drawImage(wi, -14, -14, 28, 28);
    ctx.restore();
  }
}

function drawEnemy(e) {
  const h = e.d.size;
  drawShadow(e.x, e.y + 2, e.r);
  ctx.save();
  if (e.flash > 0) ctx.filter = 'brightness(1.8)';
  if (e.frozen > 0) ctx.filter = 'hue-rotate(160deg) brightness(1.2)';
  drawSprite(wikiImage(e.d.file), e.x, e.y + 2, h, { color: e.d.boss ? '#8a2a2a' : e.d.elite ? '#7a5a2a' : '#6a6a4a', label: e.d.name[0] });
  ctx.restore();
  // health bar above the head, like the real game
  if (e.hp < e.maxHp && !e.d.boss) {
    const w = Math.max(30, e.r * 1.6);
    ctx.fillStyle = '#c00'; ctx.fillRect(e.x - w / 2, e.y - h - 8, w, 5);
    ctx.fillStyle = '#0c0'; ctx.fillRect(e.x - w / 2, e.y - h - 8, w * Math.max(0, e.hp / e.maxHp), 5);
  }
  if (e.d.elite && !e.d.boss) text(`${e.d.name} (level-${e.d.lvl})`, e.x, e.y - h - 18, 12, '#ffff00');
  if (e.healer) text(e.aggro ? 'Yt-HurKot' : 'Yt-HurKot (healing Jad)', e.x, e.y - h - 18, 12, '#ff981f');
  if (e.d.boss === 'jad' && e.ai.windup) {
    const icon = wikiImage(e.ai.windup.style === 'magic' ? 'Magic_icon.png' : 'Ranged_icon.png');
    // Shown above the player, where your eyes are, and kept clear of the top HUD
    const px = run.p.x, y = Math.max(190, run.p.y - 130);
    ctx.fillStyle = e.ai.windup.style === 'magic' ? '#ff5a1a' : '#e8c060';
    ctx.beginPath(); ctx.arc(px, y, 26, 0, 7); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    if (ready(icon)) ctx.drawImage(icon, px - 16, y - 16, 32, 32);
    text(e.ai.windup.style === 'magic' ? 'Magic! Pray 3' : 'Ranged! Pray 2', px, y - 42, 22, '#fff');
  }
}

function drawSplat(s) {
  const a = Math.min(1, s.t * 3);
  const y = s.y - (0.8 - s.t) * 20;
  ctx.globalAlpha = a;
  const color = s.kind === 'miss' ? '#2a5adf' : s.kind === 'poison' ? '#3c9a2a' : '#b00000';
  ctx.fillStyle = color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  const R = s.crit ? 19 : 15;
  for (let i = 0; i < 16; i++) {
    const r = i % 2 ? R * 0.68 : R, an = i / 16 * Math.PI * 2;
    ctx.lineTo(s.x + Math.cos(an) * r, y + Math.sin(an) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  text(String(s.v), s.x, y + 1, s.crit ? 17 : 14, '#fff');
  ctx.globalAlpha = 1;
}

function drawTitleBackdrop() {
  waveDef = WAVES[0];
  drawGround();

    drawSprite(wikiImage(d.file), x, WORLD_H - 68, d.size, { color: '#6a6a4a', label: d.name[0] });
  });
}

function begin() { sfx(440, 0.1, 'triangle', 0.05); newRun(pickedHero); }

let offers = [];
function rollOffers(fresh) {
  const lane = run.hero.lane, w = run.wave;
  const pool = Object.values(ITEMS).filter((it) =>
    (it.lane === lane || it.lane === 'any') && it.wave <= w + 1 && it.price > 0 &&
    !Object.values(run.gear).includes(it.id));
  // Weight newer tiers higher so upgrades keep coming
  const picks = [];
  const bag = pool.map((it) => ({ it, wt: 1 + Math.max(0, it.wave - w + 4) * 0.6 + (it.slot === 'food' ? 0.5 : 0) }));
  while (picks.length < 4 && bag.length) {
    const total = bag.reduce((a, b) => a + b.wt, 0);
    let r = Math.random() * total, i = 0;
    while (r > bag[i].wt) { r -= bag[i].wt; i++; }
    picks.push({ it: bag[i].it, sold: false });
    bag.splice(i, 1);
  }
  offers = picks;
  if (fresh) run.rerolls = 0;
}

function skillCost(sk) {
  const lvl = run.skills[sk.id] - (sk.id === 'hitpoints' ? 9 : 0);
  return Math.round((14 + 9 * (lvl - 1) + 0.6 * (lvl - 1) * (lvl - 1)) * ((run.hero.mods || {}).skillCost || 1));
}

function itemStatsText(it) {
  if (it.desc) return it.desc;
  const bits = [];
  if (it.w) {
    const w = it.w;
    bits.push(`${w.dmg} dmg every ${w.cd}s`);
    if (w.kind === 'swing') bits.push(w.arc > 6 ? 'hits all around you' : `reach ${w.reach}`);
    if (w.hits) bits.push(`${w.hits} hits per swing`);
    if (w.count > 1) bits.push(`${w.count} arrows`);
    if (w.pierce > 1) bits.push(`pierces ${w.pierce}`);
    if (w.splash) bits.push(`splash ${w.splash}`);
    if (w.freeze) bits.push('freezes');
    if (w.tbow) bits.push('stronger vs high levels');
  }
  if (it.def) bits.push(`+${it.def} defence`);
  if (it.dmg) bits.push(`+${Math.round(it.dmg * 100)}% damage`);
  if (it.hp) bits.push(`+${it.hp} hitpoints`);
  if (it.aspd) bits.push(`+${Math.round(it.aspd * 100)}% attack speed`);
  if (it.range) bits.push(`+${Math.round(it.range * 100)}% range`);
  if (it.gold) bits.push(`+${Math.round(it.gold * 100)}% gold`);
  return bits.join(' · ');
}

function buy(offer) {
  const it = offer.it;
  if (run.gold < it.price) return;
  if (it.slot === 'food') {
    if (run.inv[it.id] >= 5) { chat(`You can't carry more than 5 of those.`, 'r'); return; }
    run.inv[it.id]++;
  } else if (it.slot === 'potion') {
    run.potions++;
  } else {
    const st0 = stats();
    run.gear[it.slot] = it.id;
    const st1 = stats();
    run.p.hp += Math.max(0, st1.maxHp - st0.maxHp);
  }
  run.gold -= it.price;
  offer.sold = true;
  chat(`You buy ${it.name}.`, 'g');
  sfx(900, 0.08, 'triangle', 0.05);
  renderShop();
}

function trainSkill(sk) {
  const cost = skillCost(sk);
  if (run.gold < cost || run.skills[sk.id] >= 99) return;
  const st0 = stats();
  run.gold -= cost;
  run.skills[sk.id]++;
  const st1 = stats();
  run.p.hp += Math.max(0, st1.maxHp - st0.maxHp);
  chat(`Congratulations, you've just advanced your ${sk.name} level. You are now level ${run.skills[sk.id]}.`, 'b');
  [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, 0.12, 'triangle', 0.05), i * 90));
  renderShop();
}

function renderShop() {
  const st = stats();
  const s = el('div', 'sheet');

  head.appendChild(ht);
  const purse = el('div', 'purse txt'); purse.appendChild(imgTag('Coins_10000.png', 'Coins')); purse.appendChild(el('span', '', `${run.gold.toLocaleString()} coins`));
  head.appendChild(purse);
  s.appendChild(head);

  const grid = el('div', 'grid shop');
  // Left: skills and your gear
  const left = el('div');
  left.appendChild(el('div', 'sec-title', 'Train skills'));
  const sk = el('div', 'skills');
  for (const k of SKILLS) {
    if (k.lane !== 'any' && k.lane !== run.hero.lane) continue;
    const cost = skillCost(k);
    const b = el('button', 'skill'); b.type = 'button';
    b.title = k.info;
    b.disabled = run.gold < cost;
    b.appendChild(imgTag(k.file, k.name));
    const mid = el('div'); mid.appendChild(el('div', 'lv', String(run.skills[k.id]))); mid.appendChild(el('div', 'nm', `${k.name}<br>${k.info}`));
    b.appendChild(mid);
    b.appendChild(el('div', 'cost', `${cost} gp`));
    b.addEventListener('click', () => trainSkill(k));
    sk.appendChild(b);
  }
  left.appendChild(sk);
  left.appendChild(el('div', 'sec-title', 'Equipment')).style.marginTop = '14px';
  const gear = el('div', 'gear');
  for (const slot of ['weapon', 'body', 'offhand', 'neck', 'ring']) {
    const d = el('div', 'slot'); d.title = slot;
    if (run.gear[slot]) d.appendChild(imgTag(ITEMS[run.gear[slot]].file, ITEMS[run.gear[slot]].name));
    d.appendChild(el('span', '', slot));

  }
  left.appendChild(gear);
  const stl = el('div', 'stats');
  stl.innerHTML = `<span>Hitpoints</span><b>${Math.ceil(run.p.hp)} / ${st.maxHp}</b>
    <span>Damage</span><b>×${st.dmgMult.toFixed(2)}</b>
    <span>Attack speed</span><b>×${st.aspd.toFixed(2)}</b>
    <span>Damage blocked</span><b>${Math.round(st.reduce * 100)}%</b>
    <span>Critical hits</span><b>${Math.round(st.crit * 100)}%</b>
    <span>Gold bonus</span><b>×${st.goldMult.toFixed(2)}</b>
    <span>Sharks · Prayer potions</span><b>${run.inv.shark} · ${run.inv.ppot}</b>`;
  left.appendChild(stl);
  grid.appendChild(left);

  // Right: item offers
  const right = el('div');
  right.appendChild(el('div', 'sec-title', `${LANE_NAME[run.hero.lane]} shop`));
  const of = el('div', 'grid offers');
  for (const o of offers) {
    const it = o.it;
    const c = el('button', 'card offer' + (o.sold ? ' sold' : '')); c.type = 'button';
    c.disabled = o.sold || run.gold < it.price;
    const art = el('div', 'art'); art.appendChild(imgTag(it.file, it.name)); c.appendChild(art);
    c.appendChild(el('div', 'nm', it.name));
    const slotTxt = it.slot === 'food' ? 'Supply' : it.slot === 'potion' ? 'Potion' : `${it.slot[0].toUpperCase()}${it.slot.slice(1)}${run.gear[it.slot] ? ` (replaces ${ITEMS[run.gear[it.slot]].name})` : ''}`;
    c.appendChild(el('div', 'ds', `<b style="color:var(--yellow)">${slotTxt}</b><br>${itemStatsText(it)}`));
    const pr = el('div', 'price'); pr.appendChild(imgTag('Coins_10000.png', 'Coins')); pr.appendChild(document.createTextNode(o.sold ? 'Bought' : `${it.price} gp`));
    c.appendChild(pr);
    c.addEventListener('click', () => buy(o));
    of.appendChild(c);
  }
  right.appendChild(of);
  const rr = el('div', 'row'); rr.style.marginTop = '12px';
  const rerollCost = 5 + run.rerolls * 4 + run.wave;
  const rb = el('button', 'btn', `Reroll (${rerollCost} gp)`); rb.type = 'button'; rb.disabled = run.gold < rerollCost;
  rb.addEventListener('click', () => { run.gold -= rerollCost; run.rerolls++; rollOffers(false); renderShop(); });
  const nb = el('button', 'btn big', `Start wave ${run.wave + 1}`); nb.type = 'button';
  nb.addEventListener('click', startWave);
  rr.appendChild(rb); rr.appendChild(nb);
  right.appendChild(rr);
  grid.appendChild(right);
  s.appendChild(grid);
  showScreen(s);
  nb.focus({ preventScroll: true });
}

function renderVictory() {

  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx(f, 0.25, 'triangle', 0.06), i * 160));
}
