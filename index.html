<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RuneRogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen arena canvas; OSRS-style stone/parchment panels float over it. Single dark look on purpose. */
:root {
  --stone: #3e3529;
  --stone-dark: #2b241b;
  --stone-deep: #1b1610;
  --rim: #5d5040;
  --ink: #000;
  --yellow: #ffff00;
  --orange: #ff981f;
  --parch: #d8c9a3;
  --parch-ink: #2a1d0d;
  --hp: #12b312;
  --hp-lost: #b30000;
  --pray: #3ab5d8;
  --muted: #c8b98f;
  --blue: #6aa0ff;
  --red: #ff4b4b;
  --green: #6fdc4f;
  --font-display: "Pixelify Sans", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Trebuchet MS", Verdana, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stone-deep);
  color: var(--yellow);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.txt { text-shadow: 1px 1px 0 var(--ink); }
img.wiki { image-rendering: auto; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-body); font-weight: bold; }
#hud[hidden] { display: none; }
.hud-top { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel {
  background: color-mix(in srgb, var(--stone) 92%, transparent);
  border: 2px solid var(--ink);
  outline: 2px solid var(--rim);
  outline-offset: -5px;
  padding: 8px 10px;
}
.me { display: flex; gap: 8px; align-items: center; min-width: 0; }
.me .portrait { width: 44px; height: 54px; object-fit: contain; }
.bars { display: grid; gap: 4px; width: clamp(110px, 22vw, 220px); }
.bar { position: relative; height: 16px; background: var(--hp-lost); border: 1px solid var(--ink); }
.bar.pray { background: #12303a; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--hp); }
.bar.pray > i { background: var(--pray); }
.bar > b { position: absolute; inset: 0; font-size: 12px; font-weight: 600; text-align: center; line-height: 14px; color: #fff; text-shadow: 1px 1px 0 #000; }
.wave { text-align: center; }
.wave .name { color: var(--orange); font-size: 20px; font-weight: 700; }
.wave .sub { color: var(--yellow); font-size: 14px; }
.purse { display: flex; gap: 6px; align-items: center; font-size: 18px; color: var(--yellow); }
.purse img { width: 30px; height: 26px; object-fit: contain; }
#bossbar { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); width: min(520px, 80vw); text-align: center; }
#bossbar .bname { color: var(--orange); font-size: 16px; margin-bottom: 2px; }
#bossbar .bar { height: 18px; }
.hud-bottom { position: absolute; bottom: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.prayers { display: flex; gap: 6px; pointer-events: auto; }
.ds.cmp { margin-top: 4px; font-size: 12px; line-height: 1.35; border-top: 1px solid #5a4d3a; padding-top: 4px; }
#gearBar { display: none !important; } /* worn gear no longer covers the play area (Nathan); it shows on the pause and shop screens */
#gearBar { position: absolute; left: 8px; top: 64px; max-height: calc(100% - 150px); display: flex; flex-direction: column; flex-wrap: wrap; gap: 3px; }
#gearBar .gs { width: 30px; height: 30px; background: rgba(40,33,24,.82); border: 1px solid #000; outline: 1px solid #5a4d3a; display: grid; place-items: center; }
#gearBar .gs img { max-width: 26px; max-height: 26px; object-fit: contain; }
#gearBar .gs.empty { opacity: .45; }
@media (max-width: 600px) { #gearBar { top: 112px; } }
#gearBar .gs .fallback { font-size: 10px; color: var(--muted); }
.pbtn {
  position: relative; width: 52px; height: 52px; padding: 0;
  background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  cursor: pointer; display: grid; place-items: center;
}
.pbtn img { width: 30px; height: 30px; object-fit: contain; }
.pbtn.on { background: #6b5a2a; box-shadow: inset 0 0 0 2px var(--yellow); }
.pbtn small { position: absolute; left: 3px; top: 1px; font-size: 11px; color: var(--muted); font-family: var(--font-display); }
.pbtn em { position: absolute; right: 3px; bottom: 1px; font-style: normal; font-size: 13px; font-weight: bold; color: var(--yellow); font-family: var(--font-body); text-shadow: 1px 1px 0 #000; }
@media (hover: none) { .pbtn small { display: none; } }
.pbtn.spec { background: linear-gradient(to top, #2f6b2a var(--fill, 0%), var(--stone-dark) var(--fill, 0%)); }
.pbtn.spec .spec-lbl { font: 700 12px var(--font-body); color: var(--muted); letter-spacing: .5px; }
.pbtn.spec.ready { box-shadow: inset 0 0 0 2px #6fdc4f; }
.specwrap { position: relative; display: flex; }
.autospec { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; height: 24px; padding: 0; cursor: pointer;
  font: 700 11px var(--font-body); letter-spacing: .5px; color: var(--muted); background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim); }
.autospec.on { color: #b8ff9a; background: #2f6b2a; box-shadow: inset 0 0 0 1px #6fdc4f; }
.pbtn.spec.ready .spec-lbl { color: #b8ff9a; }
.pbtn.spec.none { opacity: .45; }
@media (max-width: 440px) { .prayers { gap: 3px; } .pbtn { width: 37px; height: 50px; } .pbtn img { width: 26px; height: 26px; } }
#chat {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none;
  width: min(520px, calc(100% - 24px)); max-height: 112px; overflow: hidden;
  background: color-mix(in srgb, var(--parch) 82%, transparent);
  border: 2px solid var(--ink); outline: 2px solid var(--rim); outline-offset: -5px;
  color: var(--parch-ink); font: 600 13px/1.35 var(--font-body);
  padding: 6px 10px; display: flex; flex-direction: column; justify-content: flex-end;
}
#chat .b { color: #0000c8; } #chat .r { color: #9b0000; } #chat .g { color: #005f00; }

/* Overlay screens */
#screen {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 16px; overflow-y: auto;
  background: radial-gradient(ellipse at center, #00000066, #000000cc);
}
#screen[hidden] { display: none; }
.sheet {
  width: min(1060px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--stone); border: 3px solid var(--ink); outline: 3px solid var(--rim); outline-offset: -8px;
  padding: 22px clamp(14px, 3vw, 28px);
}
.sheet h1, .sheet h2 { font-family: var(--font-display); color: var(--orange); margin: 0; text-wrap: balance; text-shadow: 2px 2px 0 #000; }
.sheet h1 { font-size: clamp(34px, 6vw, 56px); letter-spacing: 1px; }
.sheet h2 { font-size: 22px; }
.sheet p { color: var(--muted); margin: 6px 0 0; max-width: 70ch; line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.grid { display: grid; gap: 12px; }
.heroes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 16px; }
.card {
  background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  padding: 10px; color: var(--yellow); text-align: left; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.card:hover, .card:focus-visible { outline: 2px solid var(--yellow); }
.card.sel { outline: 2px solid var(--yellow); background: #4a3f2e; }
.card.locked .art img { filter: grayscale(1) brightness(.45); }
.card.locked .nm { color: var(--muted); }
.card .unlock { margin-top: 6px; font-size: 12px; color: var(--orange); font-weight: 600; }
.card .art { height: 120px; display: grid; place-items: center; }
.card .art img { max-height: 120px; max-width: 100%; object-fit: contain; }
.card .nm { font-family: var(--font-display); font-size: 17px; color: var(--orange); }
.card .ds { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.lane { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--yellow); }
.lane img { width: 18px; height: 18px; object-fit: contain; }
.btn {
  font-family: var(--font-display); font-size: 18px; color: var(--yellow);
  background: linear-gradient(#5a4b37, #3e3529); border: 2px solid var(--ink); outline: 1px solid var(--rim);
  padding: 8px 18px; cursor: pointer; pointer-events: auto;
}
.btn:hover, .btn:focus-visible { color: #fff; outline: 2px solid var(--yellow); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 22px; padding: 10px 26px; }

/* Shop */
.shop { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); margin-top: 14px; align-items: start; }
@media (max-width: 760px) { .shop { grid-template-columns: 1fr; } #chat { bottom: 104px; max-height: 72px; font-size: 12px; padding: 4px 8px; } }
@media (min-width: 761px) and (max-width: 1500px) { #chat { bottom: 104px; } }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.skill {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center;
  background: var(--stone-dark); border: 1px solid var(--ink); padding: 5px 7px; cursor: pointer; color: var(--yellow); font: inherit; text-align: left;
}
.skill img { width: 24px; height: 24px; object-fit: contain; }
.steps { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.steps-lbl { font-size: 12px; color: var(--muted, #b8a98a); margin-right: 2px; }
.btn.step { padding: 4px 10px; font-size: 14px; font-weight: bold; min-height: 0; font-family: var(--font-body); }
.btn.step.on { outline: 2px solid var(--yellow); }
.upgrades { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.sticks-btn img { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; }
.skill .lv { font-family: var(--font-body); font-weight: bold; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.skill .nm { font-size: 12px; color: var(--muted); line-height: 1.2; }
.skill .cost { font-size: 12px; color: var(--yellow); white-space: nowrap; font-variant-numeric: tabular-nums; }
.skill:hover:not(:disabled) { outline: 1px solid var(--yellow); }
.skill:disabled { opacity: .5; cursor: not-allowed; }
/* High scores */
.score-box { margin-top: 14px; text-align: left; }
.score-form { justify-content: flex-start; margin-top: 8px; }
.score-form input, .score-hero { font: 600 16px var(--font-body); color: var(--yellow); background: var(--stone-dark); border: 2px solid var(--ink); outline: 1px solid var(--rim); padding: 8px 10px; min-width: 0; flex: 1 1 160px; max-width: 260px; }
.score-tabs { margin-top: 12px; justify-content: flex-start; }
.scores { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.scores li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); column-gap: 6px; background: var(--stone-dark); border: 1px solid var(--ink); padding: 5px 8px; color: var(--yellow); }
.scores li.me { outline: 2px solid var(--orange); }
.scores li.empty { display: block; color: var(--muted); }
.scores .rk { grid-row: span 2; font-weight: bold; font-variant-numeric: tabular-nums; }
.scores .nm { font-weight: bold; overflow-wrap: anywhere; }
.scores .rc { font-size: 12.5px; color: var(--muted); }
.offers { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.offer .art { height: 64px; }
.offer .art img { max-height: 56px; }
.offer .price { font-family: var(--font-body); font-weight: bold; color: var(--yellow); font-size: 16px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.offer .price img { width: 20px; height: 18px; }
.offer.sold { opacity: .4; pointer-events: none; }
.offer-wrap { display: flex; flex-direction: column; gap: 4px; }
.offer-wrap > .offer { flex: 1; }
.offer-wrap.is-locked > .offer { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow) inset; }
.lock-btn { font-size: 12px; padding: 4px 6px; }
.lock-btn.on { color: var(--yellow); }
.supplies { margin-bottom: 14px; }
.supply { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--stone-dark); border: 1px solid var(--ink); padding: 6px 8px; margin-top: 6px; color: var(--yellow); }
.supply img { width: 28px; height: 28px; object-fit: contain; }
.supply .nm { font-size: 14px; line-height: 1.25; }
.supply .nm small { color: var(--muted); }
.supply .held { font-variant-numeric: tabular-nums; }
.sup-btns { display: flex; flex-direction: column; gap: 4px; }
.sup-btn { font: bold 13px var(--font-body); padding: 5px 8px; min-height: 0; white-space: nowrap; }
.lock-note { font-size: 13px; opacity: .8; margin: 8px 0 0; }
.gear { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.slot { width: 52px; height: 52px; background: var(--stone-dark); border: 1px solid var(--ink); outline: 1px solid var(--rim); display: grid; place-items: center; position: relative; }
.slot img { max-width: 40px; max-height: 40px; object-fit: contain; }
.slot span { position: absolute; bottom: 1px; right: 3px; font-size: 10px; color: var(--muted); }
.stats { font-size: 13px; color: var(--muted); margin-top: 8px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: start; font-variant-numeric: tabular-nums; }
.stats b { color: var(--yellow); font-weight: 600; }
.sec-title { font-family: var(--font-display); color: var(--orange); font-size: 17px; margin: 0 0 8px; }
.fallback { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-display); color: var(--orange); font-size: 20px; }
.end-art { display: flex; justify-content: center; margin: 12px 0; }
.end-art img { max-height: 160px; }
kbd { font-family: var(--font-display); background: var(--stone-dark); border: 1px solid var(--ink); padding: 0 5px; color: var(--yellow); }

/* v2 additions */
.equip { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: start; margin-top: 4px; }
.equip .slot.empty { opacity: .55; }
.equip .gap { width: 52px; height: 52px; }
.rar { font-family: var(--font-display); font-size: 12px; letter-spacing: .5px; }
.rar.common { color: #b8b8b8; } .rar.uncommon { color: #7dff7d; } .rar.rare { color: #5ab4ff; } .rar.ultra { color: var(--orange); } .rar.thirdage { color: #e8e0c0; text-shadow: 0 0 6px #c8b060; } .rar.mega { color: #e07dff; animation: glow 1.4s ease-in-out infinite; }
.ach-pop { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); z-index: 50; pointer-events: none;
  min-width: 260px; max-width: 92vw; padding: 10px 18px 12px; text-align: center;
  background: #2b2419; border: 2px solid #000; outline: 2px solid #6b5a3a; outline-offset: -5px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
  animation: achIn .35s ease-out; transition: opacity .5s, transform .5s; }
.ach-pop.out { opacity: 0; transform: translate(-50%, -12px); }
.ach-pop .ach-title { font: 700 18px var(--font-display); color: #ff981f; text-shadow: 1px 1px 0 #000; }
.ach-pop .ach-body { margin-top: 4px; color: #fff; font: 600 13px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 6px; }
.ach-pop .ach-body img { width: 22px; height: 21px; }
.ach-pop .ach-name { margin-top: 4px; color: #ffff00; font: 700 15px var(--font-body); text-shadow: 1px 1px 0 #000; }
.ach-pop .ach-reward { margin-top: 2px; color: #6fdc4f; font: 600 12px var(--font-body); }
@keyframes achIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
.ach-tier { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
.ach-tier img { width: 22px; height: 21px; }
.ach-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
.ach-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; background: var(--stone-dark); border: 1px solid var(--ink); padding: 6px 8px; }
.ach-row .ach-check { color: #6fdc4f; font-weight: bold; font-size: 16px; }
.ach-row .ach-nm { color: var(--muted); font-weight: bold; font-size: 13px; }
.ach-row .ach-ds { color: var(--muted); font-size: 12px; opacity: .8; }
.ach-row.done .ach-nm { color: var(--yellow); }
.ach-row.done { border-color: #3f6a2a; }
.yama-art img { width: 96px; height: 120px; object-fit: contain; }
.yama-quote { font-style: italic; color: #ff9a8a; }
.card.contract { outline: 2px solid #8a1a1a; background: #2a1414; text-align: left; }
.card.contract .gain { color: var(--green, #6fdc4f); font-weight: bold; }
.card.contract .price-bad { color: #ff6a5a; font-weight: bold; }
.card.contract .sign { margin-top: 8px; font-family: var(--font-display); color: var(--yellow); }
.invos { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.card.invo { padding: 8px; }
.card.invo { text-align: left; }
.card.invo .art { height: 34px; justify-items: start; }
.card.invo .art img { max-height: 32px; }
.card.invo .lvl { font-size: 12px; font-weight: bold; color: var(--yellow); margin: 2px 0; }
.card.invo.sel { outline: 2px solid var(--yellow); background: #4a3f2e; }
.card.invo.locked { opacity: .5; }
.ev-timer { height: 8px; background: #2a1c10; border: 1px solid #000; margin: 10px 0 4px; }
.ev-timer > div { height: 100%; width: 100%; background: var(--orange); }
@keyframes evbar { from { width: 100%; } to { width: 0%; } }
.ev-prompt { color: var(--yellow) !important; font-weight: bold; font-size: 16px; }
.ev-show { display: grid; place-items: center; height: 70px; margin: 6px 0; }
.ev-show img { max-height: 64px; }
.ev-big { font-size: 64px; text-align: center; color: var(--yellow); line-height: 1.1; }
.ev-opts { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); margin-top: 8px; }
.ev-opt { text-align: center; padding: 8px; min-height: 64px; }
.ev-opt .art { height: 60px; }
.ev-opt .art img { max-height: 54px; }
.ev-opt .nm { font-size: 15px; }
.card.r-uncommon { outline: 1px solid #3f9a3f; }
.card.r-rare { outline: 1px solid #5ab4ff; }
.card.r-ultra { outline: 2px solid var(--orange); background: #3d2d1c; }
.card.r-thirdage { outline: 2px solid #e8e0c0; background: #2e2c26; }
.card.r-mega { outline: 2px solid #b44be0; background: #3a2742; }
@keyframes glow { 50% { text-shadow: 0 0 10px #e07dff; } }
.hudbtns { display: flex; gap: 6px; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="panel me">
        <img class="portrait wiki" id="hudPortrait" alt="">
        <div class="bars">
          <div class="bar" id="hpBar"><i></i><b></b></div>
          <div class="bar pray" id="ppBar"><i></i><b></b></div>
        </div>
      </div>
      <div class="panel wave txt"><div class="name" id="waveName"></div><div class="sub" id="waveSub"></div></div>
      <div class="panel purse txt"><img class="wiki" data-wiki="Coins_10000.png" alt=""><span id="goldTxt">0</span></div>
    </div>
    <div id="gearBar" aria-label="Worn equipment"></div>
    <div id="bossbar" hidden class="txt"><div class="bname" id="bossName"></div><div class="bar" id="bossHp"><i></i></div></div>
    <div class="hud-bottom">
      <div class="prayers">
        <button class="pbtn" data-pray="melee" title="Protect from Melee (1)"><small>1</small><img class="wiki" data-wiki="Protect_from_Melee.png" alt="Protect from Melee"></button>
        <button class="pbtn" data-pray="ranged" title="Protect from Missiles (2)"><small>2</small><img class="wiki" data-wiki="Protect_from_Missiles.png" alt="Protect from Missiles"></button>
        <button class="pbtn" data-pray="magic" title="Protect from Magic (3)"><small>3</small><img class="wiki" data-wiki="Protect_from_Magic.png" alt="Protect from Magic"></button>
        <button class="pbtn" data-use="shark" title="Eat a Shark (E)"><small>E</small><img class="wiki" data-wiki="Shark.png" alt="Shark"><em id="sharkN">0</em></button>
        <button class="pbtn" data-use="ppot" title="Drink a Prayer potion (Q)"><small>Q</small><img class="wiki" data-wiki="Prayer_potion(4).png" alt="Prayer potion"><em id="ppotN">0</em></button>
        <div class="specwrap"><button class="autospec" id="autoSpecBtn" title="Auto special attack on/off (T)" aria-pressed="false">AUTO</button><button class="pbtn spec" id="specBtn" title="Special attack (Space)"><small>Spc</small><b class="spec-lbl">SPEC</b><em id="specN">100%</em></button></div>
        <button class="pbtn spec" id="spellBtn" title="Cast your spell (R)"><small>R</small><em id="spellN">ready</em></button>
        <button class="pbtn" id="musicBtn" title="Music on/off (M)"><small>M</small><img class="wiki" data-wiki="Music_icon.png" alt="Music"><em id="musicState">on</em></button>
        <button class="pbtn" id="pauseBtn" title="Pause (P)"><small>P</small><b class="spec-lbl">II</b><em>pause</em></button>
      </div>
    </div>
    <div id="chat"></div>
  </div>
  <div id="screen"></div>
</div>

<script>
// Phones were keeping old copies of the game scripts after an update, so each load asks for a fresh copy
// (the version changes every 10 minutes, matching how long GitHub Pages caches files).
(() => {
  const v = Math.floor(Date.now() / 600000);
  for (const f of ['data', 'achievements', 'scores-config', 'scores', 'game']) document.write(`<script src="js/${f}.js?v=${v}"><\/script>`);
})();
</script>
</body>
</html>
