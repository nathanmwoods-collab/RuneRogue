name: probe
on: { push: { branches: [tile-probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=2026-08-12_a
          for u in \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/0/2/0_50_50.png" \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/0/3/0_100_100.png" \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/0/2/0_50_-51.png" \
            "https://maps.runescape.wiki/osrs/tiles/0_2019-10-31_1/2/0_50_-51.png" \
            "https://maps.runescape.wiki/osrs/tiles/0_2019-10-31_1/2/0_50_50.png" \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/7/3/0_89_167.png" \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/0/3/0_101_308.png" \
            "https://maps.runescape.wiki/osrs/versions/$V/tiles/rendered/0/3/0_75_157.png" \
            ; do echo "$(curl -s -o /tmp/t.png -w '%{http_code} %{content_type} %{size_download}' "$u") $u"; done
          curl -s "https://maps.runescape.wiki/osrs/versions/" | head -c 600; echo
          curl -s "https://maps.runescape.wiki/osrs/versions/$V/" | head -c 600; echo
