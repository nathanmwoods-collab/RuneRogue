name: probe
on: { push: { branches: [tile-probe] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe; mkdir -p probe
          while read k; do IFS=_ read m p x y <<< "$k"
            curl -s -o probe/$k.png -w "%{http_code}" "https://maps.runescape.wiki/osrs/tiles/${m}_2019-10-31_1/3/${p}_${x}_${y}.png" | grep -q 200 || rm -f probe/$k.png
          done < list.txt
          ls probe | wc -l
          git config user.name probe; git config user.email probe@example.com
          git add -A probe && git commit -qm "probe tiles" && git push
